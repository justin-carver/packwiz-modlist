[package]
name = "sculkr"
description = "Companion CLI for packwiz - generate modlists and track Minecraft modpack changes"
authors = ["justin-carver"]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
keywords = ["packwiz", "modpack", "minecraft", "curseforge", "modlist"]
categories = ["command-line-utilities"]
repository = "https://github.com/justin-carver/sculkr"
homepage = "https://github.com/justin-carver/sculkr"
build = "build.rs"
exclude = ["./github", "/tests", "*.png"]

# We'll rely on cargo-release
[package.metadata.release]
allow-branch = ["main"]
publish = false
push = true
tag-name = "v{{version}}"
tag-message = "sculkr {{version}}"
pre-release-commit-message = "release v{{version}}"

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = "Unreleased"
replace = "{{version}}"
min = 1

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = "\\.\\.\\.HEAD"
replace = "...{{tag_name}}"
exactly = 1

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = "ReleaseDate"
replace = "{{date}}"
min = 1

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = "<!-- next-header -->"
replace = "<!-- next-header -->\n\n## [Unreleased] - ReleaseDate"
exactly = 1

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = "<!-- next-url -->"
replace = "<!-- next-url -->\n[Unreleased]: https://github.com/justin-carver/sculkr/compare/{{tag_name}}...HEAD"
exactly = 1

[[bin]]
name = "sculkr"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

clap = { version = "4.6", features = ["cargo", "derive", "color"] }

minreq = { version = "3.0", features = [
    "https-rustls",
    "json-using-serde",
    "urlencoding",
] }

serde = { version = "1.0", features = ["derive"] }
serde_with = "3.23"
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"
colored = "3.1"
log = "0.4"
simple_logger = "5.2"
dotenvy = "0.15"
